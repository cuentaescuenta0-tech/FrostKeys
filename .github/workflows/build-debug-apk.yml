name: Build FrostKeys Lineage APK

on:
  push:
    branches:
      - lineageos-migration
  pull_request:
    branches:
      - main
      - lineageos-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.0.13004108"

      - uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify parallel-install package ID
        run: |
          apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" \
            | grep -F "package: name='com.orion.frostkeys.lineage.debug'"
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" \
            | grep -Fq "android.permission.INTERNET"; then
            echo "The development APK must not request INTERNET permission." >&2
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrostKeys-Lineage-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: '*/build/reports'
          if-no-files-found: ignore
        if: ${{ failure() }}

  lineage-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LineageOS/android_packages_inputmethods_LatinIME
          ref: lineage-24.0
          path: lineage-latinime

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install LineageOS SDK and NDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.1.8937393"

      - uses: gradle/actions/setup-gradle@v3

      - name: Build LineageOS LatinIME reference APK
        working-directory: lineage-latinime
        run: ./gradlew --no-daemon assembleDebug
