name: Test FrostKeys Lineage

on:
  push:
    branches:
      - lineageos-migration
  pull_request:
    branches:
      - main
      - lineageos-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.0.13004108"

      - uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests
        run: ./gradlew --no-daemon testRunTestsUnitTest

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports'
          if-no-files-found: ignore
        if: ${{ failure() }}
